[package]
name = "russian-roulette-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Secure installer, updater and GPUI launcher for Russian Roulette Revamped"

[features]
default = []
gpui-ui = ["dep:gpui"]

[dependencies]
directories-next = "2.0.0"
anyhow = "1"
gpui = { version = "=0.2.2", optional = true }
open = "5"
semver = "1"
fs2 = "0.4"
hex = "0.4.3"
serde.workspace = true
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror.workspace = true
ureq = "2.12.1"
url = "2.5.8"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"

[[bin]]
name = "roulette-launcher"
path = "src/main.rs"
required-features = ["gpui-ui"]
