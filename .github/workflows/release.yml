name: Build and publish desktop releases

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name != 'pull_request' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: npm run lint
      - run: npm run build:pages
      - run: npm run test:wasm
      - uses: actions/upload-artifact@v7
        with:
          name: game-site
          path: dist/
          if-no-files-found: error
  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, name: linux-x86_64, triple: x86_64-unknown-linux-gnu}
          - {runner: windows-2025, name: windows-x86_64, triple: x86_64-pc-windows-msvc}
          - {runner: macos-15, name: macos-aarch64, triple: aarch64-apple-darwin}
          - {runner: macos-15-intel, name: macos-x86_64, triple: x86_64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name != 'pull_request' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libx11-xcb-dev libvulkan-dev
      - run: cargo test --locked -p russian-roulette-launcher --target ${{ matrix.triple }}
      - run: cargo build --locked --release -p russian-roulette-launcher --features gpui-ui --target ${{ matrix.triple }}
      - uses: actions/download-artifact@v8
        with:
          name: game-site
          path: dist
      - run: python scripts/package-release.py package ${{ matrix.name }} dist target/${{ matrix.triple }}/release bundle
      - name: Check packaged install, update and launch
        env:
          ROULETTE_TEST_PACKAGE: ${{ github.workspace }}/bundle
        run: cargo test --locked -p russian-roulette-launcher --target ${{ matrix.triple }} packaged_release_lifecycle -- --ignored
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: bundle/
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          path: bundles
      - run: python scripts/package-release.py manifest "$RELEASE_TAG" bundles publish
      - name: Upload to a draft and publish after all uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" publish/* --draft --verify-tag --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
